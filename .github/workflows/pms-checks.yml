# Runs on every push and pull request: rebuilds everything generated from
# pms/ and fails if the committed files are out of date, then runs the tests
# (data consistency, workflow rules, app source, accessibility, exports and
# the Office Script parity check).
name: PMS checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PyYAML (app source checks)
        run: pip install pyyaml
      - name: Rebuild generated files
        run: python -m pms build
      - name: Generated files are committed and up to date
        run: git diff --exit-code -- dist docs
      - name: Tests
        run: python -m unittest discover -s tests -v
